<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img"
     aria-label="Architecture: browsers load the static control panel from optimus and talk directly to the robot's REST API, which drives the AgiBot AimDK ROS 2 services. optimus holds restricted SSH keeper sessions on each robot, and each robot runs an identical self-healing stack.">
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="600" fill="#f8fafc"/>

  <!-- Heading -->
  <text x="40" y="38" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="18" font-weight="700" fill="#0f172a">Project Cooper — AgiBot X2 Ultra control architecture</text>
  <text x="40" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12" fill="#475569">The browser talks directly to the robot's API — optimus only serves the static page and holds the keeper sessions.</text>

  <!-- ===== Panel devices ===== -->
  <rect x="40" y="90" width="270" height="130" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="55" y="112" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12" font-weight="700" fill="#0f172a">Panel devices — any browser on the LAN</text>
  <rect x="60" y="125" width="230" height="38" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="72" y="149" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11.5" fill="#0f172a">iPad Safari — show operator</text>
  <rect x="60" y="170" width="230" height="38" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="72" y="194" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11.5" fill="#0f172a">any PC / notebook browser</text>

  <!-- Blue command path: browser -> robot API -->
  <line x1="310" y1="165" x2="479" y2="162" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="396" y="138" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10.5" font-weight="600" fill="#2563eb">HTTP JSON + X-Pin (REST)</text>
  <text x="396" y="152" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10" fill="#2563eb">polls /api/status every 3 s</text>

  <!-- Gray static-page path: Apache -> browsers -->
  <line x1="175" y1="333" x2="175" y2="224" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
  <text x="185" y="265" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10" fill="#64748b">serves the static page</text>
  <text x="185" y="279" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10" fill="#64748b">(one fetch per load)</text>

  <!-- ===== optimus ===== -->
  <rect x="40" y="300" width="270" height="180" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <text x="55" y="322" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12" font-weight="700" fill="#0f172a">optimus — Ubuntu PC · 192.168.68.51</text>
  <rect x="60" y="335" width="230" height="50" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="72" y="355" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11.5" font-weight="600" fill="#0f172a">Apache :8080 — static webpage</text>
  <text x="72" y="372" font-family="ui-monospace, Menlo, Consolas, monospace"
        font-size="9.5" fill="#475569">cooper_control_panel.html</text>
  <rect x="60" y="400" width="230" height="62" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="72" y="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11.5" font-weight="600" fill="#065f46">Session keepers ×2 (systemd)</text>
  <text x="72" y="437" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10" fill="#065f46">one per robot · dedicated key,</text>
  <text x="72" y="451" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10" fill="#065f46">restricted to an idle session only</text>

  <!-- Green keeper path: optimus -> robots -->
  <line x1="290" y1="431" x2="456" y2="431" stroke="#059669" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow-green)"/>
  <text x="374" y="416" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10" font-weight="600" fill="#059669">ssh -N · restricted key</text>
  <text x="374" y="448" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10" fill="#059669">keeps user services armed</text>

  <!-- ===== Backup webserver ===== -->
  <rect x="40" y="505" width="270" height="78" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="55" y="530" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12" font-weight="700" fill="#0f172a">Backup webserver (standby)</text>
  <text x="55" y="548" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10.5" fill="#475569">HP EliteBook 830 G10 — same Apache</text>
  <text x="55" y="563" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10.5" fill="#475569">setup + page, used if optimus is down</text>

  <!-- ===== Robot stack ===== -->
  <!-- Secondary robot: stacked card behind the primary -->
  <rect x="478" y="98" width="580" height="470" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="768" y="562" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11" fill="#475569">Secondary robot — 192.168.68.113 · identical stack (own keeper, config &amp; LinkCraft IDs)</text>

  <!-- Primary robot -->
  <rect x="460" y="80" width="580" height="470" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="106" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="13" font-weight="700" fill="#0f172a">Primary robot — AgiBot X2 Ultra · 192.168.68.115</text>

  <!-- API server -->
  <rect x="485" y="122" width="300" height="78" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="497" y="145" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12" font-weight="700" fill="#1e3a8a">cooper_panel_server.py — REST :8080</text>
  <text x="497" y="163" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10.5" fill="#1e40af">status · dances · show · mic gear-up · volume</text>
  <text x="497" y="179" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10.5" fill="#1e40af">messages · shortlist · diagnose · update · restart</text>

  <!-- Per-robot state files -->
  <rect x="855" y="122" width="165" height="100" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="865" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11" font-weight="600" fill="#0f172a">Per-robot state</text>
  <text x="865" y="161" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.3" fill="#475569">cooper_panel_config.json</text>
  <text x="865" y="177" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.3" fill="#475569">cooper_messages.json</text>
  <text x="865" y="193" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.3" fill="#475569">cooper_show_timing.json</text>
  <text x="865" y="211" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.3" fill="#64748b">(shortlist · LinkCraft ID · texts)</text>
  <line x1="787" y1="162" x2="853" y2="162" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
  <text x="820" y="152" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="9.5" fill="#334155">reads / writes</text>

  <!-- Show / action scripts -->
  <rect x="485" y="235" width="300" height="64" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="497" y="258" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11.5" font-weight="700" fill="#0f172a">x2_showroom_demo.py · x2_action.py</text>
  <text x="497" y="276" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10.5" fill="#475569">full show sequence &amp; preset-gesture runner</text>
  <line x1="560" y1="200" x2="560" y2="233" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
  <text x="568" y="221" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="9.5" fill="#334155">spawns per show / action</text>

  <!-- Self-heal watchdog -->
  <rect x="855" y="240" width="165" height="84" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
  <text x="865" y="261" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11" font-weight="600" fill="#92400e">Self-heal watchdog</text>
  <text x="865" y="279" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#92400e">systemd socket + timer, or</text>
  <text x="865" y="293" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#92400e">cron @reboot + 1-min check —</text>
  <text x="865" y="307" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#92400e">restarts the API if it dies</text>
  <line x1="853" y1="262" x2="792" y2="206" stroke="#b45309" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
  <text x="848" y="232" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="9.5" fill="#92400e">revives ≤ 60 s</text>

  <!-- AimDK services -->
  <rect x="485" y="335" width="535" height="100" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="497" y="358" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12" font-weight="700" fill="#0f172a">AgiBot AimDK — ROS 2 services (aimdk_msgs/srv)</text>
  <text x="497" y="378" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#475569">PlayTts · SetVolume · SetMute · SetMicSource / GetMicSource · GetRobotResources</text>
  <text x="497" y="395" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#475569">ExecuteActionResource (LinkCraft dance) · SetMcPresetMotion (wave · handshake · heart)</text>
  <text x="497" y="412" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#475569">SetMcAction (STAND_DEFAULT after a dance) · PlayEmoji</text>
  <line x1="600" y1="299" x2="600" y2="333" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
  <path d="M785 185 H 822 V 331" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
  <text x="712" y="325" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="9.5" fill="#334155">rclpy service calls</text>

  <!-- Hardware -->
  <rect x="485" y="470" width="535" height="56" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="497" y="493" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11.5" font-weight="700" fill="#0f172a">Robot hardware</text>
  <text x="497" y="511" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="10.5" fill="#475569">speaker · in-built + external microphone · joints &amp; motion · face display</text>
  <line x1="752" y1="435" x2="752" y2="468" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
  <text x="762" y="456" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="9.5" fill="#334155">drives</text>
</svg>
